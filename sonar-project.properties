sonar.projectKey=muxlang_mux-website
sonar.organization=muxlang
sonar.exclusions=**/node_modules/**,build/**,.docusaurus/**
# The website has no unit-test tooling (CI runs lint/typecheck/build only), so no
# coverage report is produced. Exclude UI source from coverage so the new-code
# coverage gate does not fail on every PR that adds frontend code.
sonar.coverage.exclusions=src/**/*.tsx,src/**/*.ts,scripts/**,*.ts
# Block on the quality gate: the scanner waits for server-side analysis and
# exits non-zero if the gate fails, so a failing gate fails CI (and local
# runs) instead of silently uploading. The gate's conditions are configured
# in SonarCloud (Quality Gates), not here.
sonar.qualitygate.wait=true
