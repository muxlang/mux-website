sonar.projectKey=muxlang_mux-website
sonar.organization=muxlang
sonar.exclusions=**/node_modules/**,build/**,.docusaurus/**,**/*.test.ts,**/*.test.tsx,test/**,vitest.config.*
# UI source is not yet included in a coverage report; keep that existing
# coverage policy explicit while excluding test/configuration files from the
# analyzed production-code set. Tests are validated by the Vitest CI gate.
sonar.coverage.exclusions=src/**/*.tsx,src/**/*.ts,scripts/**,tools/**/*.ts,workers/**/*.ts,*.ts
# Block on the quality gate: the scanner waits for server-side analysis and
# exits non-zero if the gate fails, so a failing gate fails CI (and local
# runs) instead of silently uploading. The gate's conditions are configured
# in SonarCloud (Quality Gates), not here.
sonar.qualitygate.wait=true
