name: Docs Snippets

# Compiles every complete ```mux example and EmbeddedPlayground block in docs/
# against the SAME released compiler the playground runs, so docs can never
# teach syntax the live playground rejects (the skew that shipped once with the
# `{:}` empty-map literal).
#
# The compiler version is read from muxlang/mux-website-api's Dockerfile
# (ARG MUX_VERSION) - the single source of truth for what the playground runs.
#
# Trigger: gates any PR that touches docs/. If this job goes red, the docs are
# ahead of the compiler release the playground runs - hold the docs change until
# that release ships (see mux-context docs/release-process.md), or opt a fence
# out with `no-compile` if it is an intentional error example. Also runnable
# manually to check the current docs against the pinned release at any time.

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/check-docs-snippets.mjs'
      - '.github/workflows/docs-snippets.yml'
  workflow_dispatch:

concurrency:
  # Supersede an in-flight run for the SAME PR. Push runs deliberately get a
  # unique group (run_id): a shared group keeps only one pending run, so rapid
  # pushes to main would evict an intermediate commit's queued run before it
  # ever ran, leaving that commit unverified.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  docs_snippets:
    name: Compile docs snippets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # `mux run` shells out to clang and the mux binary links LLVM. Keep the
      # major in one place: apt packages, the clang symlink, and LD_LIBRARY_PATH
      # all derive from it. Must match the LLVM the released compiler was built
      # against (see mux-website-api's Dockerfile).
      LLVM_VERSION: '22'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Resolve the playground's pinned compiler version
        id: pin
        run: |
          url="https://raw.githubusercontent.com/muxlang/mux-website-api/main/Dockerfile"
          version="$(curl --proto '=https' --tlsv1.2 -fsSL "$url" | sed -n 's/^ARG MUX_VERSION=\(.*\)$/\1/p' | head -n1)"
          if [ -z "$version" ]; then
            echo "::error::Could not read ARG MUX_VERSION from the playground Dockerfile ($url)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playground compiler pin: $version"

      - name: Install clang and the LLVM runtime libraries
        run: |
          # Literal https:// URL plus --max-redirect=0 means the download cannot
          # be downgraded to http via a redirect.
          wget --max-redirect=0 -O /tmp/llvm.key https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo install -Dm644 /tmp/llvm.key /usr/share/keyrings/llvm-snapshot.gpg.key
          codename="$(lsb_release -cs)"
          echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg.key] https://apt.llvm.org/${codename}/ llvm-toolchain-${codename}-${LLVM_VERSION} main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "clang-${LLVM_VERSION}" "llvm-${LLVM_VERSION}"
          sudo ln -sf "/usr/bin/clang-${LLVM_VERSION}" /usr/local/bin/clang

      - name: Install the released mux compiler
        env:
          MUX_VERSION: ${{ steps.pin.outputs.version }}
        run: |
          set -eux
          target="linux-x86_64"
          base="https://github.com/muxlang/mux-compiler/releases/download/v${MUX_VERSION}"
          archive="mux-${target}.tar.gz"
          cd /tmp
          curl --proto '=https' -fsSL "${base}/${archive}" -o "${archive}"
          curl --proto '=https' -fsSL "${base}/${archive}.sha256" -o "${archive}.sha256"
          echo "$(awk '{print $1}' "${archive}.sha256")  ${archive}" | sha256sum -c -
          tar -xzf "${archive}"
          sudo install -Dm755 "mux-${target}/bin/mux" /usr/local/bin/mux
          sudo mkdir -p /usr/local/lib/mux
          sudo cp "mux-${target}/lib/"* /usr/local/lib/mux/

      - name: Compile docs snippets
        env:
          MUX_BIN: mux
          MUX_RUNTIME_LIB: /usr/local/lib/mux/libmux_runtime.a
          LD_LIBRARY_PATH: /usr/lib/llvm-${{ env.LLVM_VERSION }}/lib
        run: npm run check:docs-snippets
