name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  # Supersede an in-flight run for the SAME PR. Push runs deliberately get a
  # unique group (run_id): a shared group keeps only one pending run, so rapid
  # pushes to main would evict an intermediate commit's queued run before it
  # ever ran, leaving that commit unverified.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint_workflows:
    # actionlint plus its built-in shellcheck integration (active once
    # shellcheck is on PATH, which it is on this image) - context #29's
    # lint-the-pipeline-itself ask. Ungated: a workflow-only change is exactly
    # what this exists to catch, and it is cheap enough not to need a filter.
    name: Lint Workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint + shellcheck
        run: ./scripts/ci/lint-workflows.sh

  website_checks:
    name: Website Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      # Verify the Monaco/Shiki keyword+type sets match the canonical
      # syntax-matrix.json in muxlang/mux-syntax-highlighting (fetched over
      # HTTP by the script). Fails if the vendored copies drift.
      - run: npm run check:syntax-parity
      - run: npm run build

  worker_checks:
    name: Worker Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: workers/mux-ai/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: workers/mux-ai
      - run: npm audit --audit-level=high
        working-directory: workers/mux-ai
      - run: npm test
        working-directory: workers/mux-ai
      - run: npm run typecheck
        working-directory: workers/mux-ai

  docs_indexer_checks:
    name: Docs Indexer Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/docs-indexer/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tools/docs-indexer
      - run: npm audit --audit-level=high
        working-directory: tools/docs-indexer
      - run: npm test
        working-directory: tools/docs-indexer
      - run: npm run typecheck
        working-directory: tools/docs-indexer

  retrieval_checks:
    name: Retrieval Tool Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/retrieval-test/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tools/retrieval-test
      - run: npm audit --audit-level=high
        working-directory: tools/retrieval-test
      - run: npm run typecheck
        working-directory: tools/retrieval-test

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Disable shallow clone for better analysis relevancy
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The free SonarCloud plan locks every project to the built-in "Sonar way"
      # gate, which only fails on rating/coverage thresholds and lets new issues
      # (e.g. a single code smell) through. Enforce "zero new issues" ourselves:
      # the scan above waits for analysis (sonar.qualitygate.wait), so the count
      # is queryable here.
      - name: Fail on new SonarCloud issues
        if: github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./scripts/ci/sonar-new-issues.sh muxlang_mux-website "${{ github.event.pull_request.number }}"
