name: Index documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "tools/docs-indexer/src/**"
      - "!tools/docs-indexer/src/**/*.test.ts"
      - "tools/docs-indexer/package.json"
      - "tools/docs-indexer/package-lock.json"
      - "tools/docs-indexer/tsconfig.json"
      - "workers/mux-ai/src/**"
      - "workers/mux-ai/package.json"
      - "workers/mux-ai/package-lock.json"
      - ".github/workflows/docs-index.yml"
  workflow_dispatch:

concurrency:
  # Share the Pages deployment lock with the ordinary deploy workflow. A
  # documentation-index run must not publish concurrently with a site build.
  group: pages
  cancel-in-progress: false

jobs:
  index:
    name: Index and evaluate documentation
    runs-on: ubuntu-latest
    environment: docs-indexing
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Candidate records live in an isolated namespace until both evaluations
      # pass. The run-specific id prefix prevents cleanup from ever touching a
      # production record with the same source hash.
      CANDIDATE_NAMESPACE: docs-candidate-${{ github.run_id }}
      CANDIDATE_ID_PREFIX: candidate-${{ github.run_id }}-
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Restore the previous vector manifest
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: tools/docs-indexer/out/manifest.json
          key: docs-index-manifest-${{ github.run_id }}
          restore-keys: docs-index-manifest-

      - name: Install indexing and evaluation dependencies
        run: |
          npm ci --prefix tools/docs-indexer --ignore-scripts
          npm ci --prefix workers/mux-ai --ignore-scripts
          npm ci --prefix tools/retrieval-test --ignore-scripts

      - name: Typecheck the indexer and Worker
        run: |
          npm run typecheck --prefix tools/docs-indexer
          npm run typecheck --prefix workers/mux-ai
          npm run typecheck --prefix tools/retrieval-test

      - name: Embed and stage candidate vectors
        env:
          VECTORIZE_NAMESPACE: ${{ env.CANDIDATE_NAMESPACE }}
          VECTORIZE_ID_PREFIX: ${{ env.CANDIDATE_ID_PREFIX }}
          VECTORIZE_NDJSON_PATH: tools/docs-indexer/out/candidate-vectors.ndjson
          VECTORIZE_MANIFEST_PATH: tools/docs-indexer/out/candidate-manifest.json
        run: |
          set -o pipefail
          npm run index --prefix tools/docs-indexer 2>&1 | tee /tmp/mux-docs-index.log

      - name: Run retrieval and diagnostic explanation evaluations
        run: |
          set -o pipefail
          npm run dev --prefix workers/mux-ai -- --remote \
            --var "VECTORIZE_NAMESPACE:${CANDIDATE_NAMESPACE}" \
            > /tmp/mux-ai-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8787/api/chat/health > /dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              echo "Worker exited before becoming ready. Wrangler log:"
              sed -n '1,240p' /tmp/mux-ai-worker.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Worker did not become ready after $((attempt * 2)) seconds. Wrangler log:"
            sed -n '1,240p' /tmp/mux-ai-worker.log
            exit 1
          fi
          echo "Worker became ready on attempt $attempt"
          SEARCH_URL=http://localhost:8787 npm run eval --prefix tools/retrieval-test 2>&1 | tee /tmp/mux-retrieval-eval.log
          WORKER_URL=http://localhost:8787 npm run error-eval --prefix tools/retrieval-test 2>&1 | tee /tmp/mux-error-eval.log

      - name: Publish the validated candidate vectors
        env:
          VECTORIZE_NAMESPACE: ${{ env.CANDIDATE_NAMESPACE }}
          VECTORIZE_ID_PREFIX: ${{ env.CANDIDATE_ID_PREFIX }}
          VECTORIZE_NDJSON_PATH: tools/docs-indexer/out/candidate-vectors.ndjson
          VECTORIZE_MANIFEST_PATH: tools/docs-indexer/out/candidate-manifest.json
          VECTORIZE_LIVE_NDJSON_PATH: tools/docs-indexer/out/vectors.ndjson
          VECTORIZE_LIVE_MANIFEST_PATH: tools/docs-indexer/out/manifest.json
        run: |
          set -o pipefail
          npm run publish --prefix tools/docs-indexer 2>&1 | tee /tmp/mux-docs-publish.log

      - name: Remove candidate vectors
        if: always()
        env:
          VECTORIZE_NAMESPACE: ${{ env.CANDIDATE_NAMESPACE }}
          VECTORIZE_ID_PREFIX: ${{ env.CANDIDATE_ID_PREFIX }}
          VECTORIZE_NDJSON_PATH: tools/docs-indexer/out/candidate-vectors.ndjson
          VECTORIZE_MANIFEST_PATH: tools/docs-indexer/out/candidate-manifest.json
        run: |
          set -o pipefail
          if [ -f "$VECTORIZE_NDJSON_PATH" ]; then
            npm run cleanup --prefix tools/docs-indexer 2>&1 | tee /tmp/mux-docs-cleanup.log
          else
            echo "No candidate vector file exists; nothing to clean up."
          fi

      - name: Record indexing revision and evaluation results
        if: always()
        run: |
          {
            echo "## Documentation indexing"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Candidate namespace: \`${CANDIDATE_NAMESPACE}\`"
            echo "- Indexer: \`$(node -p "require('./tools/docs-indexer/package.json').version")\`"
            echo "- Worker: \`$(node -p "require('./workers/mux-ai/package.json').version")\`"
            echo
            echo '```text'
            for log in /tmp/mux-docs-index.log /tmp/mux-retrieval-eval.log /tmp/mux-error-eval.log /tmp/mux-docs-publish.log /tmp/mux-docs-cleanup.log; do
              if [ -f "$log" ]; then
                cat "$log"
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the new vector manifest
        if: success()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/docs-indexer/out/manifest.json
          key: docs-index-manifest-${{ github.run_id }}

      - name: Build and publish the indexed documentation
        if: success()
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Upload the documentation site
        if: success()
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  publish:
    name: Publish indexed documentation
    needs: index
    if: success()
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
